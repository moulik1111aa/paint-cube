# Deploys the web version to Firebase Hosting (https://tic-tac-three.web.app) on every
# push to main, alongside GitHub Pages. Needs one repository secret,
# FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account with the
# "Firebase Hosting Admin" role on project tic-tac-three (scripts/firebase-deploy.mjs
# talks to the Hosting API directly).
# Until that secret exists this workflow only builds and skips the deploy.
name: Firebase site

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p site
          cp dist/index.html site/index.html

      - name: Check for the deploy key
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret yet: skipping the Firebase deploy."
          fi

      - name: Deploy to Firebase Hosting
        if: steps.key.outputs.ok == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/firebase-deploy.mjs tic-tac-three
